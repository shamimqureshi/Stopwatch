<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Stopwatch</title>
    
    <!-- Bootstrap CDN -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <div class="container text-center mt-5">
        <h2 class="fw-bold">STOPWATCH</h2>
        <p class="fst-italic">"Time is a created thing. To say 'I don't have time' is to say 'I don't want to'..."</p>

        <div class="stopwatch-container mx-auto p-4 shadow-lg">
            <h1 id="displayTime" class="display-4">00:00:00</h1>
            <div class="btn-group mt-4">
                <button class="btn btn-danger px-4" onclick="watchStop()">
                    <i class="fa fa-stop"></i> Stop
                </button>
                <button class="btn btn-success px-4" onclick="watchStart()">
                    <i class="fa fa-play"></i> Start
                </button>
                <button class="btn btn-warning px-4" onclick="watchReset()">
                    <i class="fa fa-undo"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
